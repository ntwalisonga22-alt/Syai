<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SY AI PRO</title>
    <style>
        /* MODERN CHATGPT THEMES */
        [data-theme="dark"] { --primary: #10a37f; --bg: #212121; --side: #171717; --text: #ececec; --msg-user: #2f2f2f; --msg-ai: transparent; --border: #333; }
        [data-theme="light"] { --primary: #10a37f; --bg: #ffffff; --side: #f9f9f9; --text: #000; --msg-user: #f4f4f4; --msg-ai: transparent; --border: #e5e5e5; }
        [data-theme="cyber"] { --primary: #ff00ff; --bg: #0b001a; --side: #1a0033; --text: #00ffff; --msg-user: #2a0066; --msg-ai: transparent; --border: #ff00ff; }

        body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; margin: 0; display: flex; height: 100vh; }

        /* Sidebar - Slim & Modern */
        #sidebar { width: 260px; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 15px; transition: 0.3s; }
        .logo-container { font-weight: 700; font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: var(--primary); }
        .new-chat-btn { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s; text-align: left; margin-bottom: 20px; }
        .new-chat-btn:hover { background: rgba(255,255,255,0.05); }

        #main-view { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }
        
        /* Chat Container - Centered Content */
        #chat-window { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding-bottom: 150px; }
        .message-row { width: 100%; display: flex; justify-content: center; padding: 25px 0; }
        .message-content { width: 85%; max-width: 750px; display: flex; gap: 20px; font-size: 16px; line-height: 1.6; }
        
        .avatar { width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; flex-shrink: 0; }
        .user-row { background: transparent; }
        .user-content .text-box { background: var(--msg-user); padding: 10px 18px; border-radius: 20px; align-self: flex-end; }
        .ai-row { background: var(--msg-ai); }
        
        /* Input Area - Floating Bar Style */
        .input-container { position: absolute; bottom: 0; width: 100%; display: flex; justify-content: center; padding: 20px; background: linear-gradient(transparent, var(--bg) 50%); }
        .input-box { width: 85%; max-width: 750px; background: var(--side); border: 1px solid var(--border); border-radius: 15px; display: flex; align-items: center; padding: 10px 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { flex: 1; background: transparent; border: none; color: var(--text); padding: 10px; outline: none; font-size: 16px; }
        .send-btn { background: var(--primary); color: white; border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }

        /* Login Screen */
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-box { text-align: center; width: 300px; }
        .auth-box h1 { font-size: 24px; margin-bottom: 20px; }
        .auth-input { width: 100%; padding: 12px; background: var(--side); border: 1px solid var(--border); color: var(--text); border-radius: 8px; margin-bottom: 15px; outline: none; }

        /* Header Info */
        .header-info { position: absolute; top: 15px; right: 25px; display: flex; gap: 15px; align-items: center; font-size: 12px; z-index: 10; }
        
        @media (max-width: 768px) { #sidebar { display: none; } .message-content { width: 92%; } }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="auth-box">
        <h1>SY AI PRO</h1>
        <input type="text" id="username-input" class="auth-input" placeholder="Your name">
        <button class="new-chat-btn" style="width:100%; text-align:center; background:var(--primary); color:white; border:none;" onclick="login()">Get Started</button>
        <p style="font-size:10px; margin-top:15px; opacity:0.5;">By S. Yvan</p>
    </div>
</div>

<div id="sidebar">
    <div class="logo-container">SY AI PRO</div>
    <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
    <div style="margin-top:auto; font-size:12px; opacity:0.7;">
        <b>S. Yvan @ 2026</b>
    </div>
</div>

<div id="main-view">
    <div class="header-info">
        <span>API: <span id="req-count">30</span></span>
        <select onchange="document.documentElement.setAttribute('data-theme', this.value)" style="background:transparent; color:var(--text); border:1px solid var(--border); border-radius:5px; padding:2px;">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
            <option value="cyber">Cyber</option>
        </select>
    </div>

    <div id="chat-window">
        <div class="message-row ai-row">
            <div class="message-content">
                <div class="avatar" style="background:var(--primary); color:white;">SY</div>
                <div>Hello! I'm <b>SY AI</b>, your personal assistant created by <b>S. Yvan</b>. How can I help you today?</div>
            </div>
        </div>
    </div>

    <div class="input-container">
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Message SY AI..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">↑</button>
        </div>
    </div>
</div>

<script>
    let reqLimit = 30;
    let currentHistory = [];
    const dingSound = new Audio('https://www.soundjay.com/buttons/sounds/button-3.mp3');

    function login() {
        const val = document.getElementById('username-input').value;
        if(val) document.getElementById('auth-overlay').style.display = 'none';
    }

    setInterval(() => {
        if (reqLimit < 30) {
            reqLimit = 30;
            document.getElementById('req-count').innerText = reqLimit;
            dingSound.play().catch(() => {});
        }
    }, 60000);

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if(!text || reqLimit <= 0) return;

        addMessage("user", text);
        input.value = '';
        const loadingId = addMessage("ai", "...");

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: text, history: currentHistory })
            });
            const data = await res.json();
            document.getElementById(loadingId).remove();

            if (!data.isError) {
                reqLimit--;
                document.getElementById('req-count').innerText = reqLimit;
                addMessage("ai", data.reply);
                currentHistory.push({role:"user", parts:[{text:text}]}, {role:"model", parts:[{text:data.reply}]});
            } else {
                addMessage("ai", data.reply);
            }
        } catch (e) {
            document.getElementById(loadingId).innerText = "Connection busy.";
        }
    }

    function addMessage(role, text) {
        const id = 'msg-' + Date.now();
        const win = document.getElementById('chat-window');
        const isAi = role === 'ai';
        
        win.innerHTML += `
            <div id="${id}" class="message-row ${role}-row">
                <div class="message-content">
                    <div class="avatar" style="background:${isAi ? 'var(--primary)' : '#5436da'}; color:white;">${isAi ? 'SY' : 'U'}</div>
                    <div class="text-box">${text}</div>
                </div>
            </div>`;
        
        win.scrollTop = win.scrollHeight;
        return id;
    }

    function createNewChat() {
        currentHistory = [];
        document.getElementById('chat-window').innerHTML = `
            <div class="message-row ai-row">
                <div class="message-content">
                    <div class="avatar" style="background:var(--primary); color:white;">SY</div>
                    <div>New session started. How can I help?</div>
                </div>
            </div>`;
    }
</script>
</body>
</html>
